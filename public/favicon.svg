<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#090B10" />
    </linearGradient>
    <linearGradient id="cs-indigo" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cs-rim" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E2433" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Base rounded shield container -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#cs-bg)" stroke="url(#cs-rim)" stroke-width="1.2" />

  <!-- Outer Governance Hexagon -->
  <path d="M16 5.5L25 10.7V21.3L16 26.5L7 21.3V10.7L16 5.5Z" stroke="#2D3548" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Inner Scope Reticle Ring -->
  <circle cx="16" cy="16" r="6" stroke="url(#cs-indigo)" stroke-width="1.5" stroke-dasharray="2.5 1.5" />

  <!-- Precision Scope Crosshairs -->
  <line x1="16" y1="7" x2="16" y2="10" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" />
  <line x1="16" y1="22" x2="16" y2="25" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" />
  <line x1="7" y1="16" x2="10" y2="16" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" />
  <line x1="22" y1="16" x2="25" y2="16" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" />

  <!-- Center Verification Node -->
  <circle cx="16" cy="16" r="2.2" fill="#C7D2FE" />
</svg>

